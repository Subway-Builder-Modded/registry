"name": "Map Data Quality"
"description": "Answer the data-quality questions for a map you own so it can receive its
  data-quality tier."
"title": "[Data Quality]: "
"labels":
  - "data-quality"
"body":
  - "type": "markdown"
    "attributes":
      "value": "# Map Data Quality


        These questions classify the census / official data behind your map so it can
        receive a data-quality tier. Every question is optional — **leaving a question blank
        is always safe** — but unanswered questions may keep the map at `unknown-quality`
        until a reviewer works through them with you.


        Please read the [Submission Questions
        guide](https://subwaybuildermodded.com/registry/docs/data-quality/questions) — it
        explains each question in plain language, including the golden rule: **answer with
        where the numbers are published, not where you placed them**.


        Your answers produce a provisional score in a pull request; a reviewer confirms it
        before the tier appears.


        If validation fails, you can edit this issue and comment **revalidate** to retry."
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "input"
    "id": "map-id"
    "attributes":
      "label": "Map ID"
      "description": "The ID of the map these answers describe. Must already exist in the registry
        — or have an open publish submission — and be published by your GitHub account."
    "validations":
      "required": true
  - "type": "dropdown"
    "id": "same-methodology"
    "attributes":
      "label": "Same methodology as your other maps in this country?"
      "description": "Answer Yes if this map's demand data was generated with the same
        methodology/pipeline as your existing scored maps in this country — its answers will
        be inherited from them and you may leave the remaining questions blank. See the
        sample list below (or the comment that linked you here) for the maps this refers
        to."
      "options":
        - "Yes — same methodology as my other maps in this country"
        - "No — new or different methodology"
    "validations":
      "required": false
  - "type": "input"
    "id": "same-methodology-sample"
    "attributes":
      "label": "Same-Methodology Sample (reference)"
      "description": "Auto-filled when you arrive via a prefilled link — the maps a Yes answer
        inherits from. Display-only: the registry re-derives the authoritative list, so it
        is safe to leave blank."
      "placeholder": "Leave blank — auto-filled by the invite link; the registry derives the real
        list either way."
    "validations":
      "required": false
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "markdown"
    "attributes":
      "value": "## Workplace data


        Where people **work** is the destination side of every commute, and it counts the
        most toward the map's final score."
  - "type": "dropdown"
    "id": "dq-workplace-source"
    "attributes":
      "label": "Where do your job numbers come from?"
      "description": "The key distinction: does your source know where people actually work, or
        only where their employer is registered? If unsure: check whether the source's
        documentation says \"place of work\" (or equivalent phrasing) — if present, select
        the first option; if you can't tell, name the source in Methodology and the reviewer
        will classify it."
      "options":
        - "A government census or survey that counts where people actually work"
        - "Government statistics reconstructed to actual work locations from linked records"
        - "A government business register — jobs counted at each company's registered
          address"
        - "Counts of businesses by size range, not exact job counts"
        - "Estimated from population or other indirect statistics"
        - "No real-world job data"
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-workplace-detail"
    "attributes":
      "label": "What is the smallest area your job numbers are reported for?"
      "description": "Follow the guide's Rule 1: answer with the source table's areas, not the
        map's demand points. If unsure: open the source table and look at what one row
        covers; when two grains are plausible, pick the coarser one and mention both in
        Methodology. See the guide's data-suppression note."
      "options":
        - "Small uniform grid squares, roughly 100–250 m"
        - "Individual buildings or census blocks"
        - "Neighborhoods or districts within a city"
        - "Whole cities or municipalities"
        - "Counties or larger regions"
        - "States or provinces"
        - "Not based on official statistics areas"
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-workplace-placement"
    "attributes":
      "label": "When a job number covers an area bigger than one building, how did you place the
        jobs within it?"
      "description": "This is where the spreading from Rule 1's example gets its credit. If
        unsure: describe the placement approach in Methodology; this is the question where a
        brief description helps reviewers most."
      "options":
        - "Nothing to place — the data is already per building or block"
        - "Official building footprints, split by workplace type with densities tuned to
          match real statistics"
        - "Building footprints, split by workplace type using standard assumptions"
        - "Buildings split only into homes vs workplaces, then by size"
        - "OpenStreetMap buildings, split by size"
        - "Spread evenly across each area"
    "validations":
      "required": false
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "markdown"
    "attributes":
      "value": "## Residence data


        Where people **live** is the origin side of the commute. The submission asks the
        same three questions as for the workplace side."
  - "type": "dropdown"
    "id": "dq-residence-source"
    "attributes":
      "label": "What do your population numbers count?"
      "description": "Not all \"population\" is the same population. If unsure: look for the words
        \"employed\", \"economically active\", or an age breakdown in your source — a plain
        \"population\" table is almost always total population."
      "options":
        - "Employed residents — people with jobs, counted where they live"
        - "Everyone of working age (roughly 15–64)"
        - "Total population, including children and retirees"
        - "No census population data"
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-residence-detail"
    "attributes":
      "label": "What is the smallest area your population numbers are reported for?"
      "description": "As with the workplace question: follow the guide's two rules — answer with
        the source table's areas — and account for potential data suppression."
      "options":
        - "Small uniform grid squares, roughly 100–250 m"
        - "Individual buildings or census blocks"
        - "Neighborhoods or districts within a city"
        - "Whole cities or municipalities"
        - "Counties or larger regions"
        - "States or provinces"
        - "Not based on official statistics areas"
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-residence-placement"
    "attributes":
      "label": "When a population number covers an area bigger than one building, how did you
        place the people within it?"
      "description": "The residence equivalent of the workplace placement; the main difference is
        that high-fidelity placement uses dwelling counts or residential floor area rather
        than workplace types. Answer this independently — many pipelines place jobs and
        people differently."
      "options":
        - "Nothing to place — the data is already per building or block"
        - "Official building footprints with per-building dwelling counts or residential
          floor area"
        - "Building footprints, with homes identified and weighted using standard
          assumptions"
        - "Buildings split only into homes vs workplaces, then by size"
        - "OpenStreetMap buildings, split by size"
        - "Spread evenly across each area"
    "validations":
      "required": false
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "markdown"
    "attributes":
      "value": "## Commute flows


        The pairing of who commutes **from** where **to** where. This data is often hard to
        find, and its absence is acceptable; what is scored is whether real flow data (or
        real totals) constrain the estimates."
  - "type": "dropdown"
    "id": "dq-od"
    "attributes":
      "label": "Does the census publish data about where people commute from and to?"
      "description": "The idea behind the options: estimates that are forced to add up to real,
        measured totals count for more than estimates that were never checked against
        anything. If unsure: if you used any commuting or origin-destination table at all,
        describe it in Methodology."
      "options":
        - "Yes — a full table of commuters between every pair of areas"
        - "Partial — per-area totals plus how far or where trips tend to go"
        - "Only how many commute into and out of each area"
        - "No flow data, but measured job and employed-resident totals per area that the
          estimates are forced to add up to"
        - "No — flows are fully estimated"
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-od-detail"
    "attributes":
      "label": "If you have commute-flow data, what is the smallest area it covers?"
      "description": "Only answer this if the previous question selected one of the first three
        options — it asks for the areas the commute table's origins and destinations refer
        to (a table of town-to-town flows covers whole towns). Leave it blank if there is no
        flow data — the grain of estimated flows is not scored."
      "options":
        - "Small uniform grid squares, roughly 100–250 m"
        - "Individual buildings or census blocks"
        - "Neighborhoods or districts within a city"
        - "Whole cities or municipalities"
        - "Counties or larger regions"
        - "States or provinces"
        - "Not based on official statistics areas"
    "validations":
      "required": false
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "markdown"
    "attributes":
      "value": "## Methodology"
  - "type": "textarea"
    "id": "methodology"
    "attributes":
      "label": "Methodology"
      "description": "The dropdown answers classify the data; use this space to describe the
        overall pipeline. A good methodology note includes: your sources with links; the
        pipeline in a few sentences; anything the dropdowns don't capture; and data
        vintages. Reviewers read this first — it is how ambiguous answers are resolved
        favorably rather than conservatively."
    "validations":
      "required": true
  - "type": "textarea"
    "id": "sources"
    "attributes":
      "label": "Data Source Links"
      "description": "Links to the actual tables or datasets behind the answers, one per line."
    "validations":
      "required": false
