# AUTO-GENERATED by scripts/generate-map-templates.ts. Do not edit directly.
"name": "Map Data Quality"
"description": "Answer the data-quality questions for a map you own so it can receive its
  data-quality tier."
"title": "[Data Quality]: "
"labels":
  - "data-quality"
"body":
  - "type": "markdown"
    "attributes":
      "value": "# Map Data Quality


        These questions classify the census / official data behind your map so it can
        receive a data-quality tier. Every question is optional — **leaving a question blank
        is always safe** — but unanswered questions may keep the map at `unknown-quality`
        until a reviewer works through them with you.


        Please read the [Data Quality Questions
        guide](https://github.com/Subway-Builder-Modded/registry/blob/main/docs/data-qualit\
        y-questions.md) — it explains each question in plain language, including the golden
        rule: **answer with where the numbers are published, not where you placed them**.


        Your answers produce a provisional score in a pull request; a reviewer confirms it
        before the tier appears.


        If validation fails, you can edit this issue and comment **revalidate** to retry."
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "input"
    "id": "map-id"
    "attributes":
      "label": "Map ID"
      "description": "The ID of the map these answers describe. Must already exist in the registry
        and be published by your GitHub account."
    "validations":
      "required": true
  - "type": "dropdown"
    "id": "same-methodology"
    "attributes":
      "label": "Same methodology as your other maps in this country?"
      "description": "Answer Yes if this map's demand data was generated with the same
        methodology/pipeline as your existing scored maps in this country — its answers will
        be inherited from them and you may leave the remaining questions blank. See the
        sample list below (or the comment that linked you here) for the maps this refers
        to."
      "options":
        - "Yes — same methodology as my other maps in this country"
        - "No — new or different methodology"
    "validations":
      "required": false
  - "type": "input"
    "id": "same-methodology-sample"
    "attributes":
      "label": "Same-Methodology Sample (reference)"
      "description": "Auto-filled when you arrive via a prefilled link — the maps a Yes answer
        inherits from. Display-only: the registry re-derives the authoritative list."
    "validations":
      "required": false
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "markdown"
    "attributes":
      "value": "## Workplace data


        Where people **work** — the destination side of every commute, and the largest part
        of the score."
  - "type": "dropdown"
    "id": "dq-workplace-source"
    "attributes":
      "label": "Where do your job numbers come from?"
      "description": "The key distinction: does your source know where people actually work, or
        only where their employer is registered? See the guide for examples."
      "options":
        - "A government census or survey that counts where people actually work"
        - "Government statistics reconstructed to actual work locations from linked records"
        - "A government business register — jobs counted at each company's registered
          address"
        - "Counts of businesses by size range, not exact job counts"
        - "Estimated from population or other indirect statistics"
        - "No real-world job data"
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-workplace-detail"
    "attributes":
      "label": "What is the smallest area your job numbers are reported for?"
      "description": "Answer with the smallest area in your source's own table — not how finely
        the finished map places demand points (the next question covers that)."
      "options": &a1
        - "Small uniform grid squares, roughly 100–250 m"
        - "Individual buildings or census blocks"
        - "Neighborhoods or districts within a city"
        - "Whole cities or municipalities"
        - "Counties or larger regions"
        - "States or provinces"
        - "Not based on official statistics areas"
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-workplace-placement"
    "attributes":
      "label": "When a job number covers an area bigger than one building, how did you place the
        jobs within it?"
      "description": "How totals were spread below the published grain. If unsure, describe the
        approach in Methodology instead."
      "options":
        - "Nothing to place — the data is already per building or block"
        - "Official building footprints, split by workplace type with densities tuned to
          match real statistics"
        - "Building footprints, split by workplace type using standard assumptions"
        - "Buildings split only into homes vs workplaces, then by size"
        - "OpenStreetMap buildings, split by size"
        - "Spread evenly across each area"
    "validations":
      "required": false
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "markdown"
    "attributes":
      "value": "## Residence data


        Where people **live** — the origin side of the commute. Check the guide's
        data-suppression note before answering the area question."
  - "type": "dropdown"
    "id": "dq-residence-source"
    "attributes":
      "label": "What do your population numbers count?"
      "description": "A plain \"population\" table is almost always total population; look for
        \"employed\" or an age breakdown for the higher rungs."
      "options":
        - "Employed residents — people with jobs, counted where they live"
        - "Everyone of working age (roughly 15–64)"
        - "Total population, including children and retirees"
        - "No census population data"
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-residence-detail"
    "attributes":
      "label": "What is the smallest area your population numbers are reported for?"
      "description": "Answer with the smallest area in your source's own table, using the coarsest
        grain that adds up to official totals (data suppression can hollow out fine
        tables)."
      "options": *a1
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-residence-placement"
    "attributes":
      "label": "When a population number covers an area bigger than one building, how did you
        place the people within it?"
      "description": "Answer independently from the workplace placement — many pipelines place
        jobs and people differently."
      "options":
        - "Nothing to place — the data is already per building or block"
        - "Official building footprints with per-building dwelling counts or residential
          floor area"
        - "Building footprints, with homes identified and weighted using standard
          assumptions"
        - "Buildings split only into homes vs workplaces, then by size"
        - "OpenStreetMap buildings, split by size"
        - "Spread evenly across each area"
    "validations":
      "required": false
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "markdown"
    "attributes":
      "value": "## Commute flows


        Who commutes from where to where. Absence is normal — estimates that are forced to
        add up to real measured totals count for more than unchecked estimates."
  - "type": "dropdown"
    "id": "dq-od"
    "attributes":
      "label": "Do you have data about where people commute from and to?"
      "description": "Any commuting or origin-destination table counts; describe it in Methodology
        if none of the options fit."
      "options":
        - "Yes — a full table of commuters between every pair of areas"
        - "Partial — per-area totals plus how far or where trips tend to go"
        - "Only how many commute into and out of each area"
        - "No flow data, but measured job and employed-resident totals per area that the
          estimates are forced to add up to"
        - "No — flows are fully estimated"
    "validations":
      "required": false
  - "type": "dropdown"
    "id": "dq-od-detail"
    "attributes":
      "label": "If you have commute-flow data, what is the smallest area it covers?"
      "description": "Only answer if the previous question selected one of the first three options
        — the areas the commute table's origins and destinations refer to. Leave blank
        otherwise."
      "options": *a1
    "validations":
      "required": false
  - "type": "markdown"
    "attributes":
      "value": "<br>"
  - "type": "markdown"
    "attributes":
      "value": "## Methodology"
  - "type": "textarea"
    "id": "methodology"
    "attributes":
      "label": "Methodology"
      "description": "The questions above classify your data; use this space to describe the
        overall pipeline — sources, processing steps, data vintages, and anything the
        dropdowns couldn't capture. Reviewers read this first, and it is how ambiguous
        answers are resolved favorably rather than conservatively."
    "validations":
      "required": true
  - "type": "textarea"
    "id": "sources"
    "attributes":
      "label": "Data Source Links"
      "description": "Links to the actual tables or datasets behind the answers, one per line."
    "validations":
      "required": false
