name: Publish Listing

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish-mod:
    if: >-
      contains(github.event.issue.labels.*.name, 'publish-mod') && (
        github.event_name == 'issues' ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, 'revalidate') &&
         (github.event.comment.user.id == github.event.issue.user.id ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'COLLABORATOR')) ||
        (github.event_name == 'issue_comment' &&
         (contains(github.event.comment.body, '/admin-author') ||
          contains(github.event.comment.body, '/quality-exempt')) &&
         (github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'OWNER'))
      )
    runs-on: ubuntu-latest
    steps:
      # CI-triggering identity (optional): pushes and PRs made with the
      # workflow's GITHUB_TOKEN never trigger pull_request workflows, so
      # publish PRs get no CI. When the registry bot app is configured
      # (REGISTRY_BOT_APP_ID repo variable + REGISTRY_BOT_PRIVATE_KEY secret),
      # branch pushes and PR creation use its token instead and CI runs
      # normally. Falls back to GITHUB_TOKEN when unconfigured.
      - name: Mint bot token
        id: bot-token
        if: vars.REGISTRY_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REGISTRY_BOT_APP_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scripts/pnpm-lock.yaml

      - name: Install script dependencies
        run: pnpm install --frozen-lockfile
        working-directory: scripts

      - name: Acknowledge submission
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Validating your submission — [follow the run here](${runUrl}). Results are posted in this issue when it finishes (usually a few minutes).`
            });

      - name: Acknowledge revalidation
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Detect maintainer overrides
        id: overrides
        uses: actions/github-script@v7
        with:
          script: |
            // Maintainer comment commands persist across revalidations: scan
            // ALL comments on the issue, honoring a command only when its
            // author's association is OWNER or MEMBER. A command matches when
            // the trimmed comment body equals it, or starts with it followed
            // by whitespace.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const hasCommand = (command) => comments.some((comment) => {
              if (comment.author_association !== 'OWNER' && comment.author_association !== 'MEMBER') {
                return false;
              }
              const body = (comment.body ?? '').trim();
              if (body === command) return true;
              return body.startsWith(command) && /\s/.test(body.charAt(command.length));
            });
            const adminAuthor = hasCommand('/admin-author');
            const qualityExempt = hasCommand('/quality-exempt');
            core.setOutput('admin_author', adminAuthor ? 'true' : 'false');
            core.setOutput('quality_exempt', qualityExempt ? 'true' : 'false');
            console.log(`Maintainer overrides: admin_author=${adminAuthor} quality_exempt=${qualityExempt}`);

      - name: Parse issue body
        id: parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/publish-mod.yml
          issue-body: ${{ github.event.issue.body }}

      - name: Validate submission
        id: validate
        env:
          LISTING_TYPE: mod
          ISSUE_JSON: ${{ steps.parser.outputs.jsonString }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir scripts run validate-publish

      - name: Create listing
        env:
          LISTING_TYPE: mod
          ISSUE_JSON: ${{ steps.parser.outputs.jsonString }}
          ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
          ISSUE_AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ADMIN_AUTHOR_OVERRIDE: ${{ steps.overrides.outputs.admin_author }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir scripts run create-listing

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "publish/mod/${{ fromJson(steps.parser.outputs.jsonString).mod-id }}"
          git add -A
          git commit -m "feat(mod): add ${{ fromJson(steps.parser.outputs.jsonString).mod-id }}"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/publish" 2>/dev/null || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/publish/mod" 2>/dev/null || true
          git push --force origin "publish/mod/${{ fromJson(steps.parser.outputs.jsonString).mod-id }}"

      - name: Create or update pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot-token.outputs.token || github.token }}
          script: |
            const branch = 'publish/mod/${{ fromJson(steps.parser.outputs.jsonString).mod-id }}';
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            if (existing.length > 0) {
              console.log(`PR #${existing[0].number} already exists — updated via force push`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'feat(mod): add `${{ fromJson(steps.parser.outputs.jsonString).mod-id }}`',
              body: [
                'Fixes #${{ github.event.issue.number }}',
                '',
                'Automated PR to add mod `${{ fromJson(steps.parser.outputs.jsonString).mod-id }}` to the registry.',
                '',
                'Submitted by @${{ github.event.issue.user.login }}'
              ].join('\n'),
              head: branch,
              base: 'main'
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['automated-pr']
            });

      - name: Handle success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // Remove failed-validation label if present
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'failed-validation'
              });
            } catch {}

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'A pull request has been created for your mod submission. A maintainer will review it shortly.'
            });

      - name: Handle failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let errorMsg;
            try {
              errorMsg = fs.readFileSync('scripts/validation-error.md', 'utf-8');
            } catch {
              errorMsg = 'Something went wrong while processing your submission. Please check the [workflow logs](' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['failed-validation']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: errorMsg + '\n\n---\nEdit your issue to fix the problems above, then comment **revalidate** to try again.'
            });

  publish-map:
    if: >-
      contains(github.event.issue.labels.*.name, 'publish-map') && (
        github.event_name == 'issues' ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, 'revalidate') &&
         (github.event.comment.user.id == github.event.issue.user.id ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'COLLABORATOR')) ||
        (github.event_name == 'issue_comment' &&
         (contains(github.event.comment.body, '/admin-author') ||
          contains(github.event.comment.body, '/quality-exempt')) &&
         (github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'OWNER'))
      )
    runs-on: ubuntu-latest
    steps:
      # See the publish-mod job for why this optional bot identity exists.
      - name: Mint bot token
        id: bot-token
        if: vars.REGISTRY_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REGISTRY_BOT_APP_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scripts/pnpm-lock.yaml

      - name: Install script dependencies
        run: pnpm install --frozen-lockfile
        working-directory: scripts

      - name: Acknowledge submission
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Validating your submission — [follow the run here](${runUrl}). Results are posted in this issue when it finishes (usually a few minutes).`
            });

      - name: Acknowledge revalidation
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Detect maintainer overrides
        id: overrides
        uses: actions/github-script@v7
        with:
          script: |
            // Maintainer comment commands persist across revalidations: scan
            // ALL comments on the issue, honoring a command only when its
            // author's association is OWNER or MEMBER. A command matches when
            // the trimmed comment body equals it, or starts with it followed
            // by whitespace.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const hasCommand = (command) => comments.some((comment) => {
              if (comment.author_association !== 'OWNER' && comment.author_association !== 'MEMBER') {
                return false;
              }
              const body = (comment.body ?? '').trim();
              if (body === command) return true;
              return body.startsWith(command) && /\s/.test(body.charAt(command.length));
            });
            const adminAuthor = hasCommand('/admin-author');
            const qualityExempt = hasCommand('/quality-exempt');
            core.setOutput('admin_author', adminAuthor ? 'true' : 'false');
            core.setOutput('quality_exempt', qualityExempt ? 'true' : 'false');
            console.log(`Maintainer overrides: admin_author=${adminAuthor} quality_exempt=${qualityExempt}`);

      - name: Parse issue body
        id: parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/publish-map.yml
          issue-body: ${{ github.event.issue.body }}

      - name: Validate submission
        id: validate
        env:
          LISTING_TYPE: map
          ISSUE_JSON: ${{ steps.parser.outputs.jsonString }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir scripts run validate-publish

      - name: Create listing
        env:
          LISTING_TYPE: map
          ISSUE_JSON: ${{ steps.parser.outputs.jsonString }}
          ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
          ISSUE_AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ADMIN_AUTHOR_OVERRIDE: ${{ steps.overrides.outputs.admin_author }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir scripts run create-listing

      - name: Resolve GeoNames cache key
        id: geonames-key
        run: echo "week=$(date +%Y-%U)" >> $GITHUB_OUTPUT

      - name: Cache GeoNames data
        uses: actions/cache@v4
        with:
          path: tmp/geonames
          key: geonames-${{ steps.geonames-key.outputs.week }}
          restore-keys: |
            geonames-

      - name: Generate search aliases
        run: pnpm --dir scripts run generate-search-aliases -- --map-id "${{ fromJson(steps.parser.outputs.jsonString).map-id }}"

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "publish/map/${{ fromJson(steps.parser.outputs.jsonString).map-id }}"
          git add -A
          git commit -m "feat(map): add ${{ fromJson(steps.parser.outputs.jsonString).map-id }}"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/publish" 2>/dev/null || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/publish/map" 2>/dev/null || true
          git push --force origin "publish/map/${{ fromJson(steps.parser.outputs.jsonString).map-id }}"

      - name: Create or update pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot-token.outputs.token || github.token }}
          script: |
            const branch = 'publish/map/${{ fromJson(steps.parser.outputs.jsonString).map-id }}';
            // Draft until data quality is confirmed (plan C1): GitHub cannot
            // merge a draft, which is the hard publish gate. rescore_data
            // marks it ready after confirming the answers; a maintainer can
            // mark it ready manually to grandfather (add dq-grandfathered so
            // CI's publish gate is exempted too), or waive the gate up front
            // by commenting /quality-exempt on the submission issue — then
            // the PR is created (or, if it already exists, updated) ready
            // with dq-grandfathered applied.
            const qualityExempt = '${{ steps.overrides.outputs.quality_exempt }}' === 'true';
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            if (existing.length > 0) {
              const existingPr = existing[0];
              console.log(`PR #${existingPr.number} already exists — updated via force push`);
              if (qualityExempt) {
                if (existingPr.draft) {
                  await github.graphql(
                    `mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { number } } }`,
                    { id: existingPr.node_id }
                  );
                  console.log(`PR #${existingPr.number} marked ready (quality-exempt)`);
                }
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingPr.number,
                  labels: ['dq-grandfathered']
                });
              }
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'feat(map): add `${{ fromJson(steps.parser.outputs.jsonString).map-id }}`',
              body: [
                'Fixes #${{ github.event.issue.number }}',
                '',
                'Automated PR to add map `${{ fromJson(steps.parser.outputs.jsonString).map-id }}` to the registry.',
                '',
                'Submitted by @${{ github.event.issue.user.login }}',
                '',
                qualityExempt
                  ? '**Data-quality requirement exempted by a maintainer** (`/quality-exempt` on the submission issue) — this PR is ready to merge at unconfirmed quality.'
                  : '**Draft until data quality is confirmed** — the author answers the data-quality questions (invite on the submission issue), then a maintainer reviews and comments `rescore_data` here, which marks this PR ready to merge.'
              ].join('\n'),
              head: branch,
              base: 'main',
              draft: !qualityExempt
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: qualityExempt ? ['automated-pr', 'dq-grandfathered'] : ['automated-pr']
            });

      - name: Handle success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            // Remove failed-validation label if present
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'failed-validation'
              });
            } catch {}

            // Phase-two invite: prefilled data-quality form link, with the
            // same-(author, country) scored maps a "Yes" answer inherits from.
            const fs = require('fs');
            const path = require('path');
            const mapId = '${{ fromJson(steps.parser.outputs.jsonString).map-id }}';
            const author = '${{ github.event.issue.user.login }}';
            let country = '';
            try {
              country = JSON.parse(fs.readFileSync(path.join('maps', mapId, 'manifest.json'), 'utf-8')).country ?? '';
            } catch {}

            const sample = [];
            try {
              for (const entry of fs.readdirSync('maps', { withFileTypes: true })) {
                if (!entry.isDirectory() || entry.name === mapId) continue;
                try {
                  const manifest = JSON.parse(fs.readFileSync(path.join('maps', entry.name, 'manifest.json'), 'utf-8'));
                  if (manifest.author !== author || manifest.country !== country) continue;
                  const dq = JSON.parse(fs.readFileSync(path.join('maps', entry.name, 'data-quality.json'), 'utf-8'));
                  if (dq.provenance?.method !== 'reviewed' && dq.provenance?.method !== 'backfill') continue;
                  sample.push({ id: entry.name, lastUpdated: manifest.last_updated ?? 0 });
                } catch {}
              }
            } catch {}
            sample.sort((a, b) => b.lastUpdated - a.lastUpdated);
            const sampleIds = sample.slice(0, 5).map((s) => s.id);

            // Prefill only input fields: prefilling a dropdown via query
            // params makes GitHub fall back to the blank issue editor.
            const params = new URLSearchParams({
              template: 'data-quality.yml',
              title: `[Data Quality]: ${mapId}`,
              'map-id': mapId,
            });
            if (sampleIds.length > 0) {
              params.set('same-methodology-sample', sampleIds.join(', '));
            }
            const inviteUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/issues/new?${params.toString()}`;

            const sampleNote = sampleIds.length > 0
              ? `\n\nIf this map was generated with the same methodology as your other scored ${country} maps (${sampleIds.map((id) => `[\`${id}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/tree/main/maps/${id})`).join(', ')}), select **Yes** on the first question to inherit their answers automatically.`
              : '';

            // /quality-exempt flips the required-next-step wording: the PR is
            // created ready to merge, so the comment must not claim the
            // submission is blocked on data-quality confirmation.
            const qualityExempt = '${{ steps.overrides.outputs.quality_exempt }}' === 'true';
            const dataQualityNote = qualityExempt
              ? `**Data quality:** the data-quality requirement was exempted by a maintainer (\`/quality-exempt\`), so the publish PR is ready to merge without a confirmed tier. You can still [answer the data-quality questions](${inviteUrl}) at any time to earn a tier — the [Submission Questions guide](https://subwaybuildermodded.com/registry/docs/data-quality/questions) explains every question in plain language.`
              : `**Required next step — data quality:** [answer the data-quality questions](${inviteUrl}) so your map can receive its data-quality tier. **Your submission cannot merge until a maintainer confirms your answers**; the publish PR stays in draft until then. The [Submission Questions guide](https://subwaybuildermodded.com/registry/docs/data-quality/questions) explains every question in plain language, and new submissions are subject to the [quality floor](https://subwaybuildermodded.com/registry/docs/data-quality/quality-floor) for countries with existing maps.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'A pull request has been created for your map submission. A maintainer will review it shortly.\n\n' +
                dataQualityNote +
                sampleNote
            });

      - name: Handle failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let errorMsg;
            try {
              errorMsg = fs.readFileSync('scripts/validation-error.md', 'utf-8');
            } catch {
              errorMsg = 'Something went wrong while processing your submission. Please check the [workflow logs](' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['failed-validation']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: errorMsg + '\n\n---\nEdit your issue to fix the problems above, then comment **revalidate** to try again.'
            });
