name: Process Data Quality Submission

# Phase two of a map submission: parses the data-quality issue form, resolves
# same-methodology inheritance, writes maps/<id>/data-quality.json
# (provenance self-reported), and lands it where the map lives:
# - merged maps: a dq/<id> branch + standalone PR with the provisional scores
# - unmerged maps: the open publish/map/<id> branch, so the publish PR carries
#   the answers and stays draft until a maintainer confirms
# A maintainer confirms with the `rescore_data` comment command on the PR.

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process:
    if: >-
      contains(github.event.issue.labels.*.name, 'data-quality') && (
        github.event_name == 'issues' ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, 'revalidate') &&
         (github.event.comment.user.id == github.event.issue.user.id ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'COLLABORATOR'))
      )
    runs-on: ubuntu-latest
    steps:
      # Optional CI-triggering bot identity — see publish.yml. With it, the
      # push carrying the answers retriggers CI on the target PR (provisional
      # report + publish gate); without it the flow still works, comment-only.
      - name: Mint bot token
        id: bot-token
        if: vars.REGISTRY_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REGISTRY_BOT_APP_ID }}
          private-key: ${{ secrets.REGISTRY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scripts/pnpm-lock.yaml

      - name: Install script dependencies
        run: pnpm install --frozen-lockfile
        working-directory: scripts

      - name: Acknowledge submission
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Validating your data-quality answers — [follow the run here](${runUrl}). Results are posted in this issue when it finishes (usually a few minutes).`
            });

      - name: Acknowledge revalidation
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Parse issue body
        id: parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/data-quality.yml
          issue-body: ${{ github.event.issue.body }}

      - name: Resolve target branch
        # Unmerged maps (plan C1.2): when the map is not on main but an open
        # publish branch exists, the answers land on that branch so the publish
        # PR carries them — review gates the publish merge itself.
        #
        # Only the submission's maps/<id> directory is overlaid; the working
        # tree stays on main so validation runs with current scripts/schemas.
        # Old publish branches predate the data-quality tooling entirely —
        # checking out the whole branch broke on "Missing script".
        id: target
        env:
          MAP_ID: ${{ fromJson(steps.parser.outputs.jsonString).map-id }}
        run: |
          set -euo pipefail
          if [ ! -f "maps/${MAP_ID}/manifest.json" ] \
            && git ls-remote --exit-code origin "refs/heads/publish/map/${MAP_ID}" >/dev/null 2>&1; then
            git fetch origin "publish/map/${MAP_ID}"
            git checkout FETCH_HEAD -- "maps/${MAP_ID}"
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "mode=merged" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate answers
        env:
          ISSUE_JSON: ${{ steps.parser.outputs.jsonString }}
          ISSUE_AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
        run: pnpm --dir scripts run validate-data-quality

      - name: Commit and push to publish branch
        if: steps.target.outputs.mode == 'publish'
        env:
          MAP_ID: ${{ fromJson(steps.parser.outputs.jsonString).map-id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit through a worktree pinned to the publish branch tip: the
          # main working tree only holds the maps/<id> overlay + validation
          # output, never a full checkout of the (possibly stale) branch.
          git fetch origin "publish/map/${MAP_ID}"
          git worktree add /tmp/publish-branch FETCH_HEAD
          mkdir -p "/tmp/publish-branch/maps/${MAP_ID}"
          cp "maps/${MAP_ID}/data-quality.json" "/tmp/publish-branch/maps/${MAP_ID}/"
          cp "maps/${MAP_ID}/manifest.json" "/tmp/publish-branch/maps/${MAP_ID}/"
          cd /tmp/publish-branch
          git add "maps/${MAP_ID}"
          if git diff --cached --quiet; then
            echo "No changes (answers already on the publish branch)."
          else
            git commit -m "chore(data-quality): answers for ${MAP_ID} (self-reported)"
            git push origin "HEAD:publish/map/${MAP_ID}"
          fi

      - name: Comment on publish pull request
        if: steps.target.outputs.mode == 'publish'
        id: publish-pr
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'publish/map/${{ fromJson(steps.parser.outputs.jsonString).map-id }}';
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            if (prs.length === 0) {
              core.setFailed(`No open PR found for ${branch}`);
              return;
            }
            core.setOutput('number', prs[0].number);
            let report = '';
            try {
              report = fs.readFileSync('dq-validation-report.md', 'utf-8');
            } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prs[0].number,
              body: 'Self-reported data-quality answers from #${{ github.event.issue.number }} added to this publish PR.\n\n' +
                report +
                '\n\nA maintainer confirms by commenting `rescore_data` after review; the PR stays draft until then.'
            });

      - name: Commit and push changes
        if: steps.target.outputs.mode != 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "dq/${{ fromJson(steps.parser.outputs.jsonString).map-id }}"
          git add maps/
          git commit -m "chore(data-quality): answers for ${{ fromJson(steps.parser.outputs.jsonString).map-id }} (self-reported)"
          git push --force origin "dq/${{ fromJson(steps.parser.outputs.jsonString).map-id }}"

      - name: Create or update pull request
        if: steps.target.outputs.mode != 'publish'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.bot-token.outputs.token || github.token }}
          script: |
            const branch = 'dq/${{ fromJson(steps.parser.outputs.jsonString).map-id }}';
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            if (existing.length > 0) {
              console.log(`PR #${existing[0].number} already exists — updated via force push`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'chore(data-quality): answers for `${{ fromJson(steps.parser.outputs.jsonString).map-id }}`',
              body: [
                'Fixes #${{ github.event.issue.number }}',
                '',
                'Automated PR carrying self-reported data-quality answers for `${{ fromJson(steps.parser.outputs.jsonString).map-id }}`.',
                '',
                'Submitted by @${{ github.event.issue.user.login }}',
                '',
                'A maintainer confirms by commenting `rescore_data` on this PR after review.'
              ].join('\n'),
              head: branch,
              base: 'main'
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['automated-pr']
            });

      - name: Handle success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'failed-validation'
              });
            } catch {}

            let report = '';
            try {
              report = fs.readFileSync('dq-validation-report.md', 'utf-8');
            } catch {}

            const publishPr = '${{ steps.publish-pr.outputs.number }}';
            const intro = '${{ steps.target.outputs.mode }}' === 'publish'
              ? `Your data-quality answers have been added to your publish pull request (#${publishPr}). A maintainer will review and confirm them; once confirmed, your map merges with its tier.`
              : 'A pull request has been created with your data-quality answers. A maintainer will review and confirm it shortly.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: intro + '\n\n' + report
            });

      - name: Handle failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let errorMsg;
            try {
              errorMsg = fs.readFileSync('dq-validation-error.md', 'utf-8');
            } catch {
              errorMsg = 'Something went wrong while processing your submission. Please check the [workflow logs](' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['failed-validation']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: errorMsg
            });
