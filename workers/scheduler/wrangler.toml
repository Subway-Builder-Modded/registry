name = "railyard-scheduler"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fires on the hour and half-hour (UTC). The handler dispatches download
# regeneration every fire (twice hourly) and gates the hourly/4-hourly workflows
# to the top of the hour. GH native `schedule` triggers remain active as a
# fallback — they fire ~13-47 min later and are idempotent.
[triggers]
crons = ["0,30 * * * *"]
